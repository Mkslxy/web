<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список товарів</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Магазин товарів</h1>
  <div id="totalPrice">Загальна вартість: 0 грн</div>
</header>

<aside>
  <div id="filters"></div>
  <div id="sorts"></div>
</aside>

<main>
  <div id="productList" class="product-list">
    <p id="emptyMessage">Наразі список товарів пустий. Додайте новий товар.</p>
  </div>
  <button id="addProductBtn">Додати новий товар</button>
</main>

<!-- Модальне вікно -->
<div id="productModal" class="modal hidden">
  <form id="productForm">
    <h2 id="modalTitle">Новий товар</h2>
    <input type="hidden" id="productId" />
    <input type="text" id="productName" placeholder="Назва товару" required />
    <input type="number" id="productPrice" placeholder="Ціна" required />
    <select id="productCategory" required>
      <option value="">Оберіть категорію</option>
      <option value="Електроніка">Електроніка</option>
      <option value="Одяг">Одяг</option>
      <option value="Продукти">Продукти</option>
    </select>
    <input type="url" id="productImage" placeholder="Посилання на зображення" required />
    <button type="submit">Зберегти</button>
    <button type="button" id="cancelBtn">Скасувати</button>
  </form>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="script.js"></script>
</body>
</html>
